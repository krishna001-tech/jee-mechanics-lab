<!DOCTYPE html>
<html>
<head>
  <title>JEE Mechanics Lab</title>

  <style>
    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: Arial;
      text-align: center;
    }

    canvas {
      display: block;
      margin: 20px auto;
      background: #eaf4ff;
      border: 2px solid white;
      max-width: 95%;
    }

    button, input {
      padding: 10px;
      margin: 5px;
      font-size: 16px;
    }
  </style>
</head>

<body>

<h1>JEE Mechanics Lab ⚙️</h1>

<canvas id="canvas" width="800" height="450"></canvas>
<div>
  <label>Mass (kg): </label>
  <input id="mass" type="number" value="2">

  <label>Force (N): </label>
  <input id="force" type="number" value="10">
</div>

<div>
  <button id="startButton">Start</button>
  <button id="resetButton">Reset</button>
</div>

<p id="info">Acceleration: 0 m/s²</p>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const massInput = document.getElementById("mass");
const forceInput = document.getElementById("force");

const startButton = document.getElementById("startButton");
const resetButton = document.getElementById("resetButton");

const info = document.getElementById("info");

let x = 100;
let velocity = 0;
let running = false;
let lastTime = 0;
function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Ground
  ctx.fillStyle = "#555";
  ctx.fillRect(0, 360, canvas.width, 5);

  // Box
  ctx.fillStyle = "#2196f3";
  ctx.fillRect(x, 320, 60, 40);

  // Force arrow
  ctx.strokeStyle = "#e53935";
  ctx.lineWidth = 4;

  ctx.beginPath();
  ctx.moveTo(x + 60, 340);
  ctx.lineTo(x + 120, 340);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(x + 120, 340);
  ctx.lineTo(x + 105, 330);
  ctx.moveTo(x + 120, 340);
  ctx.lineTo(x + 105, 350);
  ctx.stroke();

  ctx.fillStyle = "#111";
  ctx.font = "16px Arial";
  ctx.fillText("F = " + forceInput.value + " N", x + 65, 315);

  const m = Number(massInput.value);
  const F = Number(forceInput.value);
  const acceleration = m > 0 ? F / m : 0;

  info.textContent =
    "Acceleration: " + acceleration.toFixed(2) + " m/s²";
}

draw();startButton.addEventListener("click", function() {
  running = !running;

  if (running) {
    startButton.textContent = "Pause";
    lastTime = performance.now();
    requestAnimationFrame(update);
  } else {
    startButton.textContent = "Start";
  }
});

resetButton.addEventListener("click", function() {
  running = false;
  startButton.textContent = "Start";
  x = 100;
  velocity = 0;
  draw();
});

function update(time) {
  if (!running) return;

  const dt = (time - lastTime) / 1000;
  lastTime = time;

  const m = Number(massInput.value);
  const F = Number(forceInput.value);

  const acceleration = m > 0 ? F / m : 0;

  velocity += acceleration * dt;
  x += velocity * dt * 30;

  if (x > canvas.width - 140) {
    x = 100;
    velocity = 0;
  }

  draw();
  requestAnimationFrame(update);
}</script>

</body>
</html>
