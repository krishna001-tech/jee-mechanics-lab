<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Kinematics | JEE Mechanics Lab</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0b0f19;
    color: white;
}

header {
    background: #111827;
    padding: 25px 20px;
    text-align: center;
}

header h1 {
    margin: 0;
    font-size: 30px;
}

header p {
    color: #9ca3af;
}

.container {
    max-width: 900px;
    margin: auto;
    padding: 25px 20px;
}

.back {
    display: inline-block;
    margin-bottom: 20px;
    color: #818cf8;
    text-decoration: none;
    font-size: 17px;
}

.card {
    background: #151c2c;
    border: 1px solid #273249;
    border-radius: 18px;
    padding: 25px;
}

h2 {
    margin-top: 0;
}

canvas {
    width: 100%;
    height: 320px;
    background: #050810;
    border-radius: 12px;
    border: 1px solid #273249;
    margin: 15px 0;
}

label {
    display: block;
    margin-top: 20px;
    margin-bottom: 8px;
}

.value {
    color: #818cf8;
    font-weight: bold;
}

input[type="range"] {
    width: 100%;
}

.prediction {
    margin-top: 25px;
    padding: 20px;
    background: #0d1320;
    border: 1px solid #273249;
    border-radius: 14px;
}

.prediction h3 {
    margin-top: 0;
    color: #f59e0b;
}

.prediction p {
    color: #9ca3af;
    line-height: 1.5;
}

#predictionInput {
    width: 100%;
    padding: 14px;
    margin-top: 10px;
    border-radius: 10px;
    border: 1px solid #374151;
    background: #111827;
    color: white;
    font-size: 16px;
}

button {
    width: 100%;
    padding: 15px;
    margin-top: 18px;
    border: none;
    border-radius: 10px;
    background: #6366f1;
    color: white;
    font-size: 17px;
    font-weight: bold;
}

button:active {
    transform: scale(0.98);
}

.results {
    margin-top: 25px;
    padding: 15px;
    background: #0d1320;
    border-radius: 12px;
    line-height: 2;
}

.result-value {
    color: #22c55e;
    font-weight: bold;
}

#predictionResult {
    margin-top: 18px;
    line-height: 1.7;
    font-weight: bold;
}

</style>

</head>

<body>

<header>

<h1>🚀 Kinematics Lab</h1>

<p>Projectile Motion Simulator</p>

</header>


<div class="container">

<a class="back" href="index.html">
← Back to Mechanics Lab
</a>


<div class="card">

<h2>Projectile Motion</h2>

<canvas id="canvas"></canvas>


<label>
Initial Velocity:
<span class="value" id="velocityValue">20</span> m/s
</label>

<input
type="range"
id="velocity"
min="5"
max="50"
value="20"
>


<label>
Angle:
<span class="value" id="angleValue">45</span>°
</label>

<input
type="range"
id="angle"
min="10"
max="80"
value="45"
>


<label>
Gravity:
<span class="value" id="gravityValue">9.8</span> m/s²
</label>

<input
type="range"
id="gravity"
min="1"
max="20"
step="0.1"
value="9.8"
>


<!-- JEE PREDICTION MODE -->

<div class="prediction">

<h3>🎯 JEE Prediction Mode</h3>

<p>
Before running the simulation, predict the
horizontal range of the projectile.
</p>

<input
type="number"
id="predictionInput"
placeholder="Enter your predicted range in metres"
>

<button id="checkButton">
CHECK MY ANSWER
</button>

<div id="predictionResult"></div>

</div>


<button id="startButton">
▶ START SIMULATION
</button>


<div class="results">

<div>
Range:
<span class="result-value" id="range">—</span> m
</div>

<div>
Maximum Height:
<span class="result-value" id="height">—</span> m
</div>

<div>
Time of Flight:
<span class="result-value" id="time">—</span> s
</div>

</div>


</div>

</div>


<script>


/* GET ELEMENTS */

const canvas =
document.getElementById("canvas");

const ctx =
canvas.getContext("2d");


const velocity =
document.getElementById("velocity");

const angle =
document.getElementById("angle");

const gravity =
document.getElementById("gravity");


const velocityValue =
document.getElementById("velocityValue");

const angleValue =
document.getElementById("angleValue");

const gravityValue =
document.getElementById("gravityValue");


/* SLIDER VALUES */

velocity.addEventListener("input", function() {

    velocityValue.textContent =
        velocity.value;

});


angle.addEventListener("input", function() {

    angleValue.textContent =
        angle.value;

});


gravity.addEventListener("input", function() {

    gravityValue.textContent =
        gravity.value;

});


/* CALCULATE PHYSICS */

function calculatePhysics() {

    const u =
        Number(velocity.value);

    const theta =
        Number(angle.value)
        * Math.PI / 180;

    const g =
        Number(gravity.value);


    const timeOfFlight =
        (2 * u * Math.sin(theta)) / g;


    const maxHeight =
        (u * u *
        Math.sin(theta) *
        Math.sin(theta))
        / (2 * g);


    const range =
        (u * u *
        Math.sin(2 * theta))
        / g;


    return {
        u: u,
        theta: theta,
        g: g,
        time: timeOfFlight,
        height: maxHeight,
        range: range
    };

}


/* PREDICTION MODE */

document
.getElementById("checkButton")
.addEventListener("click", function() {


    const predictionField =
        document.getElementById(
            "predictionInput"
        );


    const result =
        document.getElementById(
            "predictionResult"
        );


    const prediction =
        Number(predictionField.value);


    /* CHECK EMPTY INPUT */

    if (
        predictionField.value.trim() === ""
        ||
        !Number.isFinite(prediction)
    ) {

        result.innerHTML =
            "⚠️ Please enter your prediction first.";

        result.style.color =
            "#f59e0b";

        return;

    }


    const physics =
        calculatePhysics();


    const actual =
        physics.range;


    const error =
        Math.abs(
            prediction - actual
        ) / actual * 100;


    let feedback;


    if (error <= 2) {

        feedback =
            "🔥 Excellent! Your prediction is extremely close.";

    }

    else if (error <= 5) {

        feedback =
            "🟢 Very good! Your physics intuition is strong.";

    }

    else if (error <= 10) {

        feedback =
            "🟡 Not bad! Try improving your estimation.";

    }

    else {

        feedback =
            "🔴 Your prediction is quite far. Try using the projectile-range relation.";

    }


    result.innerHTML =

        feedback +

        "<br><br>" +

        "Your prediction: " +

        prediction.toFixed(2) +

        " m" +

        "<br>" +

        "Actual range: " +

        actual.toFixed(2) +

        " m" +

        "<br>" +

        "Error: " +

        error.toFixed(1) +

        "%";


    if (error <= 5) {

        result.style.color =
            "#22c55e";

    }

    else if (error <= 10) {

        result.style.color =
            "#f59e0b";

    }

    else {

        result.style.color =
            "#ef4444";

    }

});


/* START SIMULATION */

document
.getElementById("startButton")
.addEventListener("click", function() {


    const physics =
        calculatePhysics();


    document.getElementById("range")
        .textContent =
        physics.range.toFixed(2);


    document.getElementById("height")
        .textContent =
        physics.height.toFixed(2);


    document.getElementById("time")
        .textContent =
        physics.time.toFixed(2);


    animate(physics);

});


/* ANIMATION */

function animate(physics) {


    canvas.width =
        canvas.clientWidth;

    canvas.height =
        320;


    let startTime = null;


    function draw(timestamp) {


        if (!startTime) {

            startTime =
                timestamp;

        }


        const elapsed =
            (timestamp - startTime)
            / 1000;


        const t =
            Math.min(
                elapsed,
                physics.time
            );


        const x =
            physics.u *
            Math.cos(physics.theta) *
            t;


        const y =
            physics.u *
            Math.sin(physics.theta) *
            t
            -
            0.5 *
            physics.g *
            t *
            t;


        ctx.clearRect(
            0,
            0,
            canvas.width,
            canvas.height
        );


        const margin = 35;

        const ground =
            canvas.height - 35;


        const scaleX =
            (canvas.width - 2 * margin)
            / physics.range;


        const scaleY =
            (canvas.height - 60)
            / Math.max(
                physics.height,
                1
            );


        /* GROUND */

        ctx.strokeStyle =
            "#64748b";

        ctx.lineWidth = 2;

        ctx.beginPath();

        ctx.moveTo(
            margin,
            ground
        );

        ctx.lineTo(
            canvas.width - margin,
            ground
        );

        ctx.stroke();


        /* TRAJECTORY */

        ctx.strokeStyle =
            "#6366f1";

        ctx.lineWidth = 4;

        ctx.beginPath();


        for (
            let time = 0;
            time <= t;
            time += 0.02
        ) {


            const trailX =
                physics.u *
                Math.cos(physics.theta) *
                time;


            const trailY =
                physics.u *
                Math.sin(physics.theta) *
                time
                -
                0.5 *
                physics.g *
                time *
                time;


            const px =
                margin +
                trailX * scaleX;


            const py =
                ground -
                trailY * scaleY;


            if (time === 0) {

                ctx.moveTo(
                    px,
                    py
                );

            }

            else {

                ctx.lineTo(
                    px,
                    py
                );

            }

        }


        ctx.stroke();


        /* PROJECTILE */

        const projectileX =
            margin +
            x * scaleX;


        const projectileY =
            ground -
            y * scaleY;


        ctx.fillStyle =
            "#22c55e";


        ctx.beginPath();

        ctx.arc(
            projectileX,
            projectileY,
            9,
            0,
            Math.PI * 2
        );

        ctx.fill();


        /* START POINT */

        ctx.fillStyle =
            "#f59e0b";


        ctx.beginPath();

        ctx.arc(
            margin,
            ground,
            5,
            0,
            Math.PI * 2
        );

        ctx.fill();


        if (
            t < physics.time
        ) {

            requestAnimationFrame(
                draw
            );

        }

    }


    requestAnimationFrame(draw);

}


</script>

</body>

</html>
